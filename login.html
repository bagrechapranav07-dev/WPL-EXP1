<!DOCTYPE html>
<html>
<head>
<title>Login - CarePlus Hospital</title>
<style>
body {
margin: 0;
background-color: #F4F9FC;
font-family: Arial, Helvetica, sans-serif;
}
/* Header */
.header {
background-color: #087E8B;
color: white;
padding: 20px 50px;
}
.header h1 {
display: inline;
font-size: 30px;
}
/* Navigation */
.nav {
background-color: #05668D;
text-align: right;
padding: 15px 50px;
}
.nav a {
color: white;
text-decoration: none;
margin-left: 30px;
font-size: 16px;
}
.nav a:hover {
color: #FFD166;
}
/* Login Box */
.login-box {
background-color: white;
width: 400px;
margin: 60px auto;
padding: 40px;
border: 1px solid #D0E5EA;
border-radius: 10px;
text-align: center;
}
.login-box h2 {
color: #05668D;
font-size: 28px;
}
.login-box p {
color: #666666;
}
label {
display: block;
text-align: left;
margin-left: 25px;
margin-top: 20px;
color: #333333;
}
input[type="text"],
input[type="password"] {
width: 85%;
padding: 12px;
margin-top: 8px;
border: 1px solid #AAAAAA;
border-radius: 5px;
}
input[type="submit"] {
background-color: #087E8B;
color: white;
border: none;
width: 120px;
padding: 12px;
margin-top: 25px;
border-radius: 5px;
font-size: 16px;
}
input[type="submit"]:hover {
background-color: #05668D;
}
.register-link {
margin-top: 20px;
}
.register-link a {
color: #087E8B;
text-decoration: none;
}
.register-link a:hover {
color: #05668D;
}
/* Footer */
.footer {
background-color: #05668D;
color: white;
text-align: center;
padding: 20px;
}
</style>
</head>
<body>
<!-- Header -->
<div class="header">
<h1>✚ CarePlus Hospital</h1>
</div>
<!-- Navigation -->
<div class="nav">
<a href="index.html">Home</a>
<a href="catalogue.html">Catalogue</a>
<a href="registration.html">Registration</a>
<a href="login.html">Login</a>
</div>
<!-- Login Form -->
<div class="login-box">
<h2>Patient Login</h2>
<p>
Login to access your hospital account.
</p>
<form>
<label>Email / Username</label>
<input type="text"
placeholder="Enter your email or username">
<label>Password</label>
<input type="password"
placeholder="Enter your password">
<br>
<input type="submit"
value="Login">
</form>
<div class="register-link">
<p>
New patient?
<a href="registration.html">
Create an account
</a>
</p>
</div>
</div>
<!-- Footer -->
<div class="footer">
<p>
    © 2026 CarePlus Hospital |
careplus@gmail.com |
+91 98765 43210
</p>
</div>
</body>
</html>
