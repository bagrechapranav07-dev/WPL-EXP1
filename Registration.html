<!DOCTYPE html>
<html>
<head>
<title>Registration - CarePlus Hospital</title>
<style>
body {
margin: 0;
background-color: #F4F9FC;
font-family: Arial, Helvetica, sans-serif;
}
/* Header */
.header {
background-color: #087E8B;
color: white;
padding: 20px 50px;
}
.header h1 {
display: inline;
font-size: 30px;
}
/* Navigation */
.nav {
background-color: #05668D;
text-align: right;
padding: 15px 50px;
}
.nav a {
color: white;
text-decoration: none;
margin-left: 30px;
font-size: 16px;
}
.nav a:hover {
color: #FFD166;
}
/* Registration Form */
.form-container {
background-color: white;
width: 650px;
margin: 40px auto;
padding: 35px;
border: 1px solid #D0E5EA;
border-radius: 10px;
}
.form-container h2 {
text-align: center;
color: #05668D;
}
.form-container p {
text-align: center;
color: #666666;
}
label {
display: block;
margin-top: 15px;
color: #333333;
font-weight: bold;
}
input[type="text"],
input[type="email"],
input[type="number"],
input[type="date"],
input[type="password"],
select,
textarea {
width: 95%;
padding: 10px;
margin-top: 7px;
border: 1px solid #AAAAAA;
border-radius: 5px;
}
input[type="radio"] {
margin-top: 15px;
}
input[type="submit"] {
display: block;
background-color: #087E8B;
color: white;
border: none;
padding: 13px 40px;
margin: 25px auto 0;
border-radius: 5px;
font-size: 16px;
}
input[type="submit"]:hover {
background-color: #05668D;
}
/* Footer */
.footer {
background-color: #05668D;
color: white;
text-align: center;
padding: 25px;
margin-top: 30px;
}
</style>
</head>
<body>
<!-- Header -->
<div class="header">
<h1>✚ CarePlus Hospital</h1>
</div>
<!-- Navigation -->
<div class="nav">
<a href="index.html">Home</a>
<a href="catalogue.html">Catalogue</a>
<a href="registration.html">Registration</a>
<a href="login.html">Login</a>
</div>
<!-- Registration Form -->
<div class="form-container">
<h2>Patient Registration</h2>
<p>
Please enter your details to register with CarePlus Hospital.
</p>
<form>
<label>Full Name</label>
<input type="text"
placeholder="Enter your full name">
<label>Date of Birth</label>
<input type="date">
<label>Age</label>
<input type="number"
placeholder="Enter your age">
<label>Gender</label>
<input type="radio" name="gender">
Male
<input type="radio" name="gender">
Female
<input type="radio" name="gender">
Other
<label>Email Address</label>
<input type="email"
placeholder="Enter your email">
<label>Phone Number</label>
<input type="text"
placeholder="Enter your phone number">
<label>Select Department</label>
<select>
<option>General Medicine</option>
<option>Cardiology</option>
<option>Neurology</option>
<option>Orthopedics</option>
<option>Dermatology</option>
</select>
<label>Address</label>
<textarea rows="4"
placeholder="Enter your complete address"></textarea>
<label>Create Password</label>
<input type="password"
placeholder="Create a password">
<input type="submit"
value="Register">
</form>
</div>
<!-- Footer -->
<div class="footer">
<p><b>CarePlus Hospital</b></p>
<p>
123 Health Avenue, Mumbai |
+91 98765 43210 |
careplus@gmail.com
</p>
<p>
© 2026 CarePlus Hospital. All Rights Reserved.
</p>
</div>
</body>
</html>
